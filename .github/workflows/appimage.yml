# Build the AppImage, prove it runs, and attach it to a release.
#
# The runner's glibc does not bound who can run the result: the interpreter
# comes from python-build-standalone (floor 2.17) and the only wheel that
# matters is PySide6's manylinux one. So this uses ubuntu-latest rather than
# pinning an old image to buy a floor it already has.
#
# The step that earns its place is "run the built file". Everything else tests
# the checkout, and the checkout is not what people download - a bundle can be
# green in every unit test and still fail to start.
name: AppImage

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only used by the release step below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Two different needs here.
      #
      # libxcb-cursor0 and libxcb-xinerama0 are COPIED INTO the bundle: Qt 6.5+
      # wants them at runtime and the wheels do not carry them.
      #
      # The rest are what the bundle asks of the machine it runs on, and
      # deliberately does not carry - libEGL and libGL above all, because those
      # must be the ones belonging to the user's driver. Every desktop has
      # them; a CI runner is a headless server image and does not, which is
      # what made the window fail to start here. The list is the DT_NEEDED set
      # of QtCore, QtGui, QtWidgets and QtDBus, not a guess.
      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-cursor0 libxcb-xinerama0 desktop-file-utils \
            libegl1 libgl1 libx11-6 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      # The same three gates the tree is held to. Before packaging, because
      # shipping a bundle of code that does not pass is worse than not shipping.
      - name: Gates
        run: |
          python -m pip install --quiet pytest
          python tools/check_shims.py
          python -m pytest tests -q
          python tools/smoke.py

      - name: Desktop entry
        run: desktop-file-validate packaging/dlss5-linux.desktop

      # The icon is generated, so it must match what is committed - otherwise
      # the script and the file drift and nobody can say which is authoritative.
      # Compared as an image, not as bytes: zlib does not promise the same
      # output across versions and does not give it, so cmp here failed on
      # pixels that were identical.
      - name: Icon is the one the script draws
        run: python packaging/make_icon.py --check packaging/dlss5-linux.png

      - name: Build
        run: bash packaging/build-appimage.sh

      # pins.lock is committed and is authority. A build that had to write one
      # means the recorded hash moved, and that is a change to review on its
      # own, not something to discover in a release.
      - name: Pins did not move
        run: git diff --exit-code packaging/pins.lock

      # The only test of the packaging itself: everything above tests the
      # checkout, and the checkout is not what anybody downloads. Same script
      # that runs on a development machine, so a failure here is reproducible
      # there rather than being a thing that only happens in CI.
      - name: The built file runs
        run: bash packaging/smoke-appimage.sh dlss5-linux-*-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: dlss5-linux-AppImage
          path: dlss5-linux-*-x86_64.AppImage
          if-no-files-found: error

      # Only on a published release. LeShade's workflow builds on push and
      # never uploads, so its AppImage lives as an Actions artifact that no
      # user ever sees; this is that mistake, not repeated.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="$(ls dlss5-linux-*-x86_64.AppImage)"
          sha256sum "$APP" > SHA256SUMS.txt
          gh release upload "${{ github.event.release.tag_name }}" \
             "$APP" "$APP.zsync" SHA256SUMS.txt --clobber
