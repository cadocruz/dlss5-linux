; FFXIV-specific OptiScaler keys, merged over the shipped ini by ffxiv_apply.py.
; Source: RenoDX Discord thread (swoodaneue's tested inis, 9/4-9/6) -- see
; FINDINGS.md. Windows-only keys (fakenvapi Reflex/XeLL) are left out:
; under Proton dxvk-nvapi provides real NVAPI, OptiScaler's fakenvapi is unused.
[Upscalers]
; dx11on12 DLSS -- "the only option that can run DLSS Neural Rendering" on a D3D11 game
Dx11Upscaler=dlss_12
Dx12Upscaler=dlss
[DRS]
; lets OptiScaler take the resolution at start; without these DLSS w/Dx12 only
; comes up if you load with FSR3 first and switch afterwards
DrsMinOverrideEnabled=true
DrsMaxOverrideEnabled=true
[QualityOverrides]
; one value everywhere -- the game's DRS otherwise crashes on zone change
QualityRatioDLAA=1.300000
QualityRatioUltraQuality=1.300000
QualityRatioQuality=1.300000
QualityRatioBalanced=1.300000
QualityRatioPerformance=1.300000
QualityRatioUltraPerformance=1.300000
[Dx11withDx12]
UseDelayedInit=true
[Hooks]
HookOriginalNvngxOnly=true
[InitFlags]
DepthInverted=true
[Log]
LogToFile=true
LogLevel=2
